<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>쇼츠 연속재생</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--panel:#fff;--ink:#18202E;--muted:#5B6576;--line:#D5DBE5;--accent:#D6204A;--accent-ink:#fff;--warn:#9A5B00;--warn-bg:#FFF3DC;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12161F;--panel:#1B212D;--ink:#E9EDF4;--muted:#9AA4B5;--line:#2E3747;--accent:#FF4D6D;--accent-ink:#1A0A10;--warn:#F2B560;--warn-bg:#35291A}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.go{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px}
.order{display:flex;gap:18px;margin-top:12px;font-size:.95rem;flex-wrap:wrap}
.order label{display:flex;align-items:center;gap:6px;cursor:pointer}
.order input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.92rem}
.msg ol{margin:6px 0 0;padding-left:20px}
.stage{margin:18px auto 0;width:min(100%, calc(78vh * 9 / 16));aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden}
.stage > *{width:100%;height:100%;display:block}
.ctrl{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctrl button{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);padding:9px 16px}
.ctrl .share{border-color:var(--accent);color:var(--accent);font-weight:500}
#now{text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px}
main{max-width:960px}
.wrap{display:grid;gap:20px}
@media (min-width:860px){ .wrap.on{grid-template-columns:minmax(0,380px) 1fr;align-items:start} .wrap.on .list{max-height:86vh} }
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;min-height:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.list-head span{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;overflow-y:auto;max-height:70vh;padding:2px}
.card{background:none;padding:0;text-align:left;color:var(--ink);border-radius:10px;display:flex;flex-direction:column;gap:4px}
.card .th{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;padding:1px 6px;border-radius:6px}
.card .tt{font-size:.75rem;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.views{display:flex;gap:4px}
.views button{background:none;border:1.5px solid var(--line);color:var(--muted);padding:3px 10px;font-size:.8rem;border-radius:8px}
.views button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:500}
.grid.rows{grid-template-columns:1fr;gap:4px}
.grid.rows .card{flex-direction:row;align-items:center;gap:12px;padding:6px;border-radius:10px}
.grid.rows .card:hover{background:var(--bg)}
.grid.rows .card .th{width:48px;flex:none;border-radius:6px}
.grid.rows .card .no{display:none}
.grid.rows .card .rn{display:block}
.grid.rows .card .tt{font-size:.9rem;color:var(--ink);min-height:0;flex:1}
.grid.rows .card.cur{background:var(--bg)}
.grid.rows .card.cur .th{outline-width:2px;outline-offset:-2px}
.card .rn{display:none;width:2.2em;flex:none;text-align:right;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.card.cur .th{outline:3px solid var(--accent);outline-offset:-3px}
.card.cur .tt{color:var(--ink);font-weight:500}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <h1>쇼츠 연속재생</h1>
  <p class="lead">채널 ID를 넣으면 그 채널의 쇼츠를 반복 없이 끝까지 이어서 재생합니다.</p>
  <div class="row">
    <input id="inp" type="text" autocomplete="off" spellcheck="false" placeholder="UC로 시작하는 채널 ID">
    <button class="go" id="go">재생</button>
  </div>
  <div class="order">
    <label><input type="radio" name="order" value="new" checked> 최신순</label>
    <label><input type="radio" name="order" value="old"> 오래된 순 (업로드 순)</label>
  </div>
  <div id="msg"></div>
  <div id="area" hidden>
  <div class="wrap" id="wrap"><div>
    <div class="stage"><div id="player"></div></div>
    <div id="now"></div>
    <div class="ctrl">
      <button id="prev">◀ 이전</button>
      <button id="next">다음 ▶</button>
      <button class="share" id="share">이 채널 링크 공유</button>
    </div>
  </div>
  <section class="list" id="listBox" hidden>
    <div class="list-head"><div><b>전체 쇼츠</b> <span id="count"></span></div>
      <div class="views" role="group" aria-label="보기 방식"><button data-view="grid" aria-pressed="true">격자</button><button data-view="rows" aria-pressed="false">목록</button></div></div>
    <div class="grid" id="grid"></div>
  </section>
  </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let player=null, apiReady=false, pendingTail=null, currentTail=null;

function parse(raw){
  const s=raw.trim(); if(!s) return {type:'empty'};
  let m=s.match(/\bUC([A-Za-z0-9_-]{22})\b/)||s.match(/\bUU(?:SH|LF|LV)?([A-Za-z0-9_-]{22})\b/);
  if(m) return {type:'channel',tail:m[1]};
  if(/@[^\/\s?]+/.test(s)) return {type:'handle'};
  return {type:'unknown'};
}
function showMsg(html){ $('#msg').innerHTML = html ? `<div class="msg">${html}</div>` : ''; }

function start(){
  const r=parse($('#inp').value);
  if(r.type==='empty') return;
  if(r.type==='handle'){ showMsg(`@핸들 주소는 바로 쓸 수 없어요. 채널 ID를 넣어 주세요.
    <ol><li>채널 설명의 …더보기를 엽니다. (모바일은 브라우저 메뉴에서 '데스크톱 사이트'를 켜 주세요)</li>
    <li>채널 공유 → 채널 ID 복사</li><li>위 칸에 붙여넣기</li></ol>`); return; }
  if(r.type==='unknown'){ showMsg('채널 ID를 찾지 못했어요. UC로 시작하는 24자리 값인지 확인해 주세요.'); return; }
  showMsg(''); play(r.tail);
}

const getOrder=()=>document.querySelector('input[name=order]:checked').value;
function setOrder(v){ const el=document.querySelector(`input[name=order][value="${v}"]`); if(el) el.checked=true; }
const orderLabel=()=>getOrder()==='old'?'오래된 순':'최신순';

function play(tail){
  currentTail=tail;
  const order=getOrder();
  $('#area').hidden=false;
  const url=new URL(location.href); url.searchParams.set('c','UC'+tail); url.searchParams.set('o',order); history.replaceState(null,'',url);
  if(!apiReady){ pendingTail=tail; return; }
  if(player){ try{ player.destroy(); }catch(_){} }
  document.querySelector('.stage').innerHTML='<div id="player"></div>';
  $('#listBox').hidden=true; $('#wrap').classList.remove('on'); $('#grid').innerHTML='';
  $('#now').textContent = order==='old' ? '쇼츠 목록을 불러오는 중…' : '';
  player=new YT.Player('player',{
    playerVars:{listType:'playlist',list:'UUSH'+tail,playsinline:1,rel:0,autoplay:order==='old'?0:1},
    events:{
      onReady:()=>loadList(0,order),
      onStateChange:e=>{ if(e.data===YT.PlayerState.PLAYING){ updateNow(); markCurrent(); } },
      onError:()=>{ toast('재생할 수 없는 영상이라 건너뜁니다'); setTimeout(()=>player.nextVideo(),800); }
    }
  });
}
// 유튜브가 준 목록(최신순)을 받아 목록 화면을 만들고, 오래된 순이면 뒤집어서 다시 올림
function loadList(tries,order){
  let ids=null; try{ ids=player.getPlaylist(); }catch(_){}
  if(!(ids && ids.length)){
    if(tries>40){ if(order==='old') $('#now').textContent='순서를 바꾸지 못해 최신순으로 재생합니다'; return; }
    return setTimeout(()=>loadList(tries+1,order),250);
  }
  let list=ids.slice();
  if(order==='old'){
    list.reverse();
    player.cuePlaylist(list,0);
    $('#now').textContent=`오래된 순 · 1 / ${list.length} · 재생 버튼을 눌러 주세요`;
  }
  renderGrid(list);
}
let titleObs=null;
function renderGrid(list){
  const g=$('#grid');
  g.innerHTML=list.map((id,i)=>`<button class="card" data-i="${i}" data-id="${id}" aria-label="${i+1}번째 쇼츠 재생">
    <span class="rn">${i+1}</span><div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt=""><span class="no">${i+1}</span></div>
    <div class="tt">${i+1}번째 쇼츠</div></button>`).join('');
  $('#count').textContent=`${list.length}개 · 누르면 거기서부터 재생`;
  $('#listBox').hidden=false; $('#wrap').classList.add('on');
  if(titleObs) titleObs.disconnect();
  titleObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ titleObs.unobserve(e.target); fetchTitle(e.target); } }),{root:g,rootMargin:'200px'});
  g.querySelectorAll('.card').forEach(c=>titleObs.observe(c));
  markCurrent();
}
// 제목은 보조 기능: 못 가져오면 번호와 썸네일만 표시
async function fetchTitle(card){
  try{
    const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+card.dataset.id));
    const j=await r.json(); if(j.title){ card.querySelector('.tt').textContent=j.title; card.setAttribute('aria-label',j.title+' 재생'); }
  }catch(_){}
}
$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c||!player) return;
  player.playVideoAt(+c.dataset.i);
});
// 보기 방식 전환 (선택은 이 브라우저에 기억)
function setView(v){
  $('#grid').classList.toggle('rows', v==='rows');
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.view===v));
  try{ localStorage.setItem('shorts-view', v); }catch(_){}
  markCurrent();
}
document.querySelector('.views').addEventListener('click',e=>{ const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view); });
try{ const v=localStorage.getItem('shorts-view'); if(v) setTimeout(()=>setView(v)); }catch(_){}

function markCurrent(){
  let i=-1; try{ i=player.getPlaylistIndex(); }catch(_){}
  document.querySelectorAll('.card.cur').forEach(c=>c.classList.remove('cur'));
  const c=document.querySelector(`.card[data-i="${i}"]`);
  if(c){ c.classList.add('cur'); c.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function updateNow(){
  try{ const i=player.getPlaylistIndex(), n=(player.getPlaylist()||[]).length;
    $('#now').textContent = n ? `${orderLabel()} · ${i+1} / ${n}` : ''; }catch(_){}
}
document.querySelectorAll('input[name=order]').forEach(r=>r.addEventListener('change',()=>{ if(currentTail) play(currentTail); }));

window.onYouTubeIframeAPIReady=()=>{ apiReady=true; if(pendingTail){ const t=pendingTail; pendingTail=null; play(t); } };

$('#go').onclick=start;
$('#inp').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
$('#prev').onclick=()=>player&&player.previousVideo();
$('#next').onclick=()=>player&&player.nextVideo();
$('#share').onclick=async()=>{
  const u=location.origin+location.pathname+'?c=UC'+currentTail+'&o='+getOrder();
  try{ await navigator.clipboard.writeText(u); }
  catch(_){ const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); try{document.execCommand('copy')}catch(_){} t.remove(); }
  toast('링크를 복사했어요. 카톡에 붙여넣으면 바로 이 채널이 재생돼요');
};
let tt; function toast(m){const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200)}

// 주소에 ?c=UC... 가 있으면 바로 준비
const qp=new URLSearchParams(location.search), c=qp.get('c');
if(qp.get('o')) setOrder(qp.get('o'));
if(c){ $('#inp').value=c; start(); }

const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body>
</html>
