<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>쇼츠 연속재생</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--panel:#fff;--ink:#18202E;--muted:#5B6576;--line:#D5DBE5;--accent:#D6204A;--accent-ink:#fff;--warn:#9A5B00;--warn-bg:#FFF3DC;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12161F;--panel:#1B212D;--ink:#E9EDF4;--muted:#9AA4B5;--line:#2E3747;--accent:#FF4D6D;--accent-ink:#1A0A10;--warn:#F2B560;--warn-bg:#35291A}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.go{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.92rem}
.msg ol{margin:6px 0 0;padding-left:20px}
.stage{margin:18px auto 0;width:min(100%, calc(78vh * 9 / 16));aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden}
.stage > *{width:100%;height:100%;display:block}
.ctrl{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctrl button{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);padding:9px 16px}
.ctrl .share{border-color:var(--accent);color:var(--accent);font-weight:500}
#now{text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <h1>쇼츠 연속재생</h1>
  <p class="lead">채널 ID를 넣으면 그 채널의 쇼츠를 반복 없이 끝까지 이어서 재생합니다.</p>
  <div class="row">
    <input id="inp" type="text" autocomplete="off" spellcheck="false" placeholder="UC로 시작하는 채널 ID">
    <button class="go" id="go">재생</button>
  </div>
  <div id="msg"></div>
  <div id="area" hidden>
    <div class="stage"><div id="player"></div></div>
    <div id="now"></div>
    <div class="ctrl">
      <button id="prev">◀ 이전</button>
      <button id="next">다음 ▶</button>
      <button class="share" id="share">이 채널 링크 공유</button>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let player=null, apiReady=false, pendingTail=null, currentTail=null;

function parse(raw){
  const s=raw.trim(); if(!s) return {type:'empty'};
  let m=s.match(/\bUC([A-Za-z0-9_-]{22})\b/)||s.match(/\bUU(?:SH|LF|LV)?([A-Za-z0-9_-]{22})\b/);
  if(m) return {type:'channel',tail:m[1]};
  if(/@[^\/\s?]+/.test(s)) return {type:'handle'};
  return {type:'unknown'};
}
function showMsg(html){ $('#msg').innerHTML = html ? `<div class="msg">${html}</div>` : ''; }

function start(){
  const r=parse($('#inp').value);
  if(r.type==='empty') return;
  if(r.type==='handle'){ showMsg(`@핸들 주소는 바로 쓸 수 없어요. 채널 ID를 넣어 주세요.
    <ol><li>채널 설명의 …더보기를 엽니다. (모바일은 브라우저 메뉴에서 '데스크톱 사이트'를 켜 주세요)</li>
    <li>채널 공유 → 채널 ID 복사</li><li>위 칸에 붙여넣기</li></ol>`); return; }
  if(r.type==='unknown'){ showMsg('채널 ID를 찾지 못했어요. UC로 시작하는 24자리 값인지 확인해 주세요.'); return; }
  showMsg(''); play(r.tail);
}

function play(tail){
  currentTail=tail;
  $('#area').hidden=false;
  const url=new URL(location.href); url.searchParams.set('c','UC'+tail); history.replaceState(null,'',url);
  if(!apiReady){ pendingTail=tail; return; }
  const list='UUSH'+tail;
  if(player){ player.loadPlaylist({listType:'playlist',list,index:0}); return; }
  player=new YT.Player('player',{
    playerVars:{listType:'playlist',list,playsinline:1,rel:0,autoplay:1},
    events:{
      onStateChange:e=>{ if(e.data===YT.PlayerState.PLAYING) updateNow(); },
      onError:()=>{ toast('재생할 수 없는 영상이라 건너뜁니다'); setTimeout(()=>player.nextVideo(),800); }
    }
  });
}
function updateNow(){
  try{ const i=player.getPlaylistIndex(), n=(player.getPlaylist()||[]).length;
    $('#now').textContent = n ? `${i+1} / ${n}` : ''; }catch(_){}
}

window.onYouTubeIframeAPIReady=()=>{ apiReady=true; if(pendingTail){ const t=pendingTail; pendingTail=null; play(t); } };

$('#go').onclick=start;
$('#inp').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
$('#prev').onclick=()=>player&&player.previousVideo();
$('#next').onclick=()=>player&&player.nextVideo();
$('#share').onclick=async()=>{
  const u=location.origin+location.pathname+'?c=UC'+currentTail;
  try{ await navigator.clipboard.writeText(u); }
  catch(_){ const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); try{document.execCommand('copy')}catch(_){} t.remove(); }
  toast('링크를 복사했어요. 카톡에 붙여넣으면 바로 이 채널이 재생돼요');
};
let tt; function toast(m){const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200)}

// 주소에 ?c=UC... 가 있으면 바로 준비
const c=new URLSearchParams(location.search).get('c');
if(c){ $('#inp').value=c; start(); }

const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body>
</html>
